name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (for image push)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            NEXUS_TOKEN=${{ secrets.NEXUS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Resultatet:
#   docker pull ghcr.io/bimo-dk/nexus-portal:latest
#   docker pull ghcr.io/bimo-dk/nexus-portal:sha-<commit>
#
# Krævet på repo: Settings → Secrets → Actions:
#   - GITHUB_TOKEN  (auto-provisioned, har packages:read for @bimo-dk scope)
#   - NEXUS_TOKEN   (din valgte token-værdi for X-Nexus-Token i prod)
